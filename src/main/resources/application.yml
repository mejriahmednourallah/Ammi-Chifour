spring:
  application:
    name: ami-chifour
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:louagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081
  compression:
    enabled: true

louage:
  jwt:
    secret: 586E3272357538782F413F4428472B4B6250645367566B597033733676397924
    expiration-ms: 86400000 # 24 hours
  sse:
    heartbeat-interval-seconds: 15
    coalesce-window-ms: 500
  sim:
    default-speed: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
